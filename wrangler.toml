name = "imgversus"
compatibility_date = "2025-06-01"
pages_build_output_dir = "public"

# Resimler ve albüm bilgileri Cloudflare KV'de tutulur.
# "npx wrangler kv namespace create IMAGES" komutunun verdiği id'yi buraya yaz.
[[kv_namespaces]]
binding = "IMAGES"
id = "4b63fc1cf5694dc3ad7d064f5fdebb13"

# Kullanım istatistikleri (yükleme, görüntüleme, geri bildirim). "npm run stats" ile okunur.
[[d1_databases]]
binding = "STATS"
database_name = "imgversus-stats"
database_id = "cd0b2d09-1c3c-4074-acde-92cecb1478ba"
migrations_dir = "migrations"

# Resim depolama: Cloudflare R2 (10 GB ücretsiz, sonrası GB başına aylık ~0,015 $).
# Yeni resimler R2'ye gider; R2'den önce yüklenenler KV'den okunmaya devam eder (bkz. lib/storage.js).
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "imgversus-images"
